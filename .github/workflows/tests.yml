name: tests

# run the test suite on every push and pull request
# and check the pinned packages for known security problems, weekly too so new advisories show up
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements-dev.txt
      - name: test
        # one worker per core, each test has its own database so they can run side by side
        run: python -m pytest -q -n auto tests

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt pip-audit
      # checks every installed package, including the ones pulled in indirectly, against the osv and pypi advisories
      - name: audit
        run: pip-audit --skip-editable
