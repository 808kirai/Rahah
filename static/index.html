<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rahah</title>
    <meta name="description" content="Rahah, a study companion for any subject, your documents and your code">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0c'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='-apple-system,Segoe UI,sans-serif' font-size='38' font-weight='700' fill='%23fefefe'%3ER%3C/text%3E%3C/svg%3E">

    <!-- apply the saved theme before anything paints -->
    <script>
        try {
            var saved_theme = localStorage.getItem("rahah-theme");
            if (saved_theme === "light" || saved_theme === "dark") document.documentElement.setAttribute("data-theme", saved_theme);
        } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <a class="brand" href="/">Rahah</a>
                <button class="icon-btn only-mobile" id="close-sidebar" aria-label="Close menu">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <button class="btn btn-outline new-chat" id="new-chat">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                New chat
            </button>
            <p class="sidebar-label">Recent</p>
            <nav class="history" id="history" aria-label="Recent chats"></nav>
            <div class="sidebar-bottom">
                <button class="btn btn-outline theme-toggle" id="theme-toggle" aria-label="Switch theme">
                    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <span class="theme-label">Light mode</span>
                </button>
            </div>
        </aside>
        <div class="scrim" id="scrim"></div>

        <main class="main">
            <header class="topbar">
                <button class="icon-btn only-mobile" id="open-sidebar" aria-label="Open menu">
                    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <h1 class="chat-title" id="chat-title">New chat</h1>
                <label class="mode-picker">
                    <span class="visually-hidden">Subject mode</span>
                    <select id="mode"></select>
                </label>
            </header>

            <section class="thread" id="thread" aria-live="polite">
                <div class="welcome" id="welcome">
                    <h2>What are we studying today?</h2>
                    <p>Ask about any subject, upload your notes or slides, or paste some code.</p>
                    <div class="suggestions">
                        <button class="suggestion" data-mode="maths" data-text="Explain how to solve quadratic equations by completing the square, with one worked example.">
                            <strong>Maths</strong><span>Completing the square, step by step</span>
                        </button>
                        <button class="suggestion" data-mode="science" data-text="Explain photosynthesis simply, then ask me three questions to check I understood.">
                            <strong>Science</strong><span>Photosynthesis, then check my understanding</span>
                        </button>
                        <button class="suggestion" data-mode="coding" data-text="What is the difference between a list and a tuple in Python, and when should I use each?">
                            <strong>Coding</strong><span>Lists vs tuples in Python</span>
                        </button>
                        <button class="suggestion" data-mode="exam" data-text="Give me five practice questions on the causes of World War I, one at a time.">
                            <strong>Exam prep</strong><span>Practice questions, one at a time</span>
                        </button>
                    </div>
                </div>
            </section>

            <form class="composer" id="composer">
                <div class="composer-box" id="composer-box">
                    <div class="attachments" id="attachments"></div>
                    <textarea id="input" rows="1" placeholder="Ask Rahah anything, or drop a PDF here" aria-label="Message"></textarea>
                    <div class="composer-actions">
                        <button type="button" class="icon-btn" id="attach" aria-label="Attach files" title="Attach PDF, text or image">
                            <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
                        </button>
                        <input type="file" id="file-input" multiple hidden accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,.gif">
                        <button type="submit" class="send-btn" id="send" aria-label="Send" disabled>
                            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                        </button>
                    </div>
                </div>
                <p class="disclaimer">Rahah can make mistakes. Check important facts against your course material.</p>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
