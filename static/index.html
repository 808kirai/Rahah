<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rahah</title>
    <meta name="description" content="Rahah, a study companion for any subject, your documents and your code">
    <meta name="theme-color" content="#16191d">
    <link rel="icon" type="image/png" href="/static/img/icon-64.png">
    <link rel="apple-touch-icon" href="/static/img/icon-180.png">

    <!-- apply the saved theme before anything paints -->
    <script>
        try {
            var saved_theme = localStorage.getItem("rahah-theme");
            if (saved_theme === "light" || saved_theme === "dark") document.documentElement.setAttribute("data-theme", saved_theme);
        } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="is-home is-page">
    <main class="main">
        <header class="nav">
            <div class="nav-left">
                <a class="brand" href="/" data-home>Rahah</a>
                <button class="icon-btn back-btn" type="button" data-home aria-label="Back to home">
                    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
                </button>
            </div>
            <h1 class="nav-title"><span class="page-title" id="page-title">Home</span><span class="chat-title" id="chat-title">New chat</span></h1>
            <div class="nav-right">
                <div class="mode-picker">
                    <select id="mode" aria-label="Subject mode"></select>
                </div>
                <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
                    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
            </div>
        </header>

        <section class="thread" id="thread" aria-live="polite">
            <div class="welcome" id="welcome">
                <div class="greeting">
                    <p>Welcome back</p>
                    <h2>What are we studying today?</h2>
                </div>
                <div class="rows" id="rows"></div>
            </div>
        </section>

        <div class="dock">
            <nav class="tabs" aria-label="Main">
                <button class="tab" type="button" data-home data-tab="home">
                    <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>
                    <span>Home</span>
                </button>
                <button class="tab" type="button" data-recents data-tab="recents">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                    <span>Recents</span>
                </button>
                <button class="tab" type="button" data-performance data-tab="performance">
                    <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-8"/></svg>
                    <span>Performance</span>
                </button>
                <button class="tab" type="button" data-open-chats data-tab="chats">
                    <svg viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
                    <span>Chats</span>
                </button>
            </nav>
            <form class="composer" id="composer">
                <div class="composer-box" id="composer-box">
                    <div class="attachments" id="attachments"></div>
                    <div class="composer-row">
                        <button type="button" class="icon-btn" id="attach" aria-label="Attach files" title="Attach PDF, text or image">
                            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                        <input type="file" id="file-input" multiple hidden accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,.gif,.py,.js,.ts,.java,.c,.cpp,.h,.cs,.go,.rs,.rb,.php,.kt,.swift,.r,.sql,.sh,.html,.css,.json,.csv">
                        <textarea id="input" rows="1" placeholder="Ask anything, or drop a PDF here" aria-label="Message"></textarea>
                        <button type="submit" class="send-btn" id="send" aria-label="Send" disabled>
                            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <p class="disclaimer">Rahah can make mistakes. Check important facts against your course material.</p>
    </main>

    <aside class="drawer" id="drawer" aria-label="My chats">
        <div class="drawer-top">
            <p class="drawer-title">My chats</p>
            <button class="icon-btn" id="close-drawer" type="button" aria-label="Close my chats">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <button class="btn btn-accent new-chat" id="new-chat" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New chat
        </button>
        <nav class="history" id="history" aria-label="Recent chats"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
        <form class="sheet-form" id="sheet-form">
            <div class="sheet-top">
                <h2 id="sheet-title">Make flashcards</h2>
                <button class="icon-btn" type="button" id="sheet-close" aria-label="Close">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <label class="field">
                <span class="field-label">Topic</span>
                <textarea id="sheet-topic" rows="3" maxlength="2000"></textarea>
            </label>
            <div class="field">
                <span class="field-label">Notes</span>
                <div class="sheet-files" id="sheet-files"></div>
                <div>
                    <button class="btn btn-soft btn-small" type="button" id="sheet-attach">
                        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        Add notes
                    </button>
                </div>
                <input type="file" id="sheet-file-input" multiple hidden accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,.gif">
            </div>
            <div class="field-row">
                <div class="field">
                    <span class="field-label">Subject</span>
                    <select class="pill-select" id="sheet-mode" aria-label="Subject"></select>
                </div>
                <div class="field">
                    <span class="field-label" id="sheet-choice-label">Cards</span>
                    <div class="choices" id="sheet-choices" role="group" aria-labelledby="sheet-choice-label"></div>
                </div>
            </div>
            <p class="sheet-error" id="sheet-error" role="alert" hidden></p>
            <div class="sheet-actions">
                <p class="sheet-note" id="sheet-note" hidden>This can take up to a minute.</p>
                <button class="btn btn-ghost" type="button" id="sheet-cancel">Cancel</button>
                <button class="btn btn-accent" type="submit" id="sheet-submit">Make flashcards</button>
            </div>
        </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
