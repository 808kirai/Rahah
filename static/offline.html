<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Rahah is offline</title>
    <meta name="theme-color" content="#f3f7fa">
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: #f3f7fa; color: #0c1a26; text-align: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        img { width: 72px; height: 72px; border-radius: 12px; }
        h1 { margin: 18px 0 6px; font-size: 1.4rem; }
        p { margin: 0 0 22px; color: #5a6b7b; }
        button {
            padding: 0.7rem 1.5rem; border: none; border-radius: 999px; cursor: pointer;
            background: #08699a; color: #fff; font: inherit; font-weight: 500;
        }
    </style>
</head>
<body>
    <main>
        <img src="/static/img/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Rahah needs the internet to answer. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
